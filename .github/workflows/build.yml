name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Feste Build-GUID (leer = neue Kennung je Lauf)"
        required: false
        type: string
      release_tag:
        description: "Freigabe unter diesem Tag anlegen, z. B. v1.0.0 (leer = keine Freigabe)"
        required: false
        type: string

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore tests/IsoForge.Tests/IsoForge.Tests.csproj

      - name: Test
        run: dotnet test tests/IsoForge.Tests/IsoForge.Tests.csproj --configuration Release --nologo --logger "console;verbosity=normal"

  build:
    name: IsoForge.exe
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        id: build
        shell: pwsh
        run: |
          $arguments = @{ SkipTests = $true }
          if ('${{ inputs.build_id }}') {
              $arguments.BuildId = '${{ inputs.build_id }}'
          }
          else {
              # Eine Freigabe soll reproduzierbar sein: die Kennung wird aus dem Tag abgeleitet,
              # nicht gewuerfelt. Derselbe Tag ergibt damit immer dieselbe Programmdatei.
              $tag = '${{ inputs.release_tag }}'
              if (-not $tag -and $env:GITHUB_REF -like 'refs/tags/*') { $tag = $env:GITHUB_REF_NAME }
              if ($tag) {
                  $seed = [Text.Encoding]::UTF8.GetBytes("IsoForge|$tag")
                  $hash = [Security.Cryptography.SHA256]::HashData($seed)
                  $arguments.BuildId = [guid]::new($hash[0..15])
              }
          }
          ./build.ps1 @arguments

          $exe = Get-ChildItem artifacts/IsoForge-*.exe | Select-Object -First 1
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "shortid=$($exe.BaseName -replace '.*-', '')" >> $env:GITHUB_OUTPUT

      - name: Selbsttest des ISO-Schreibers
        shell: pwsh
        run: |
          & '${{ steps.build.outputs.exe }}' selftest --out "$env:RUNNER_TEMP\isoforge-selftest"
          if ($LASTEXITCODE -ne 0) { throw 'Der Selbsttest ist fehlgeschlagen.' }

      - name: Erzeugte Abbilder gegenpruefen
        shell: pwsh
        run: |
          # Windows selbst muss die Abbilder einhaengen koennen - das prueft die Struktur unabhaengig
          # vom eigenen Leser.
          $expected = @(
              'bootmgr',
              'boot\boot.sdi',
              'efi\boot\bootx64.efi',
              'efi\microsoft\boot\bcd',
              'sources\boot.wim',
              'sources\install.swm',
              'IsoForge\media.cmd'
          )

          $isos = Get-ChildItem "$env:RUNNER_TEMP\isoforge-selftest\*.iso"
          if ($isos.Count -lt 2) {
              throw "Erwartet wurden zwei Abbilder (eingebauter Schreiber und IMAPI), gefunden: $($isos.Count)."
          }

          foreach ($iso in $isos) {
              Write-Host ""
              Write-Host "=== $($iso.Name) ($([math]::Round($iso.Length / 1MB, 1)) MB)"
              $image = Mount-DiskImage -ImagePath $iso.FullName -PassThru
              try {
                  $volume = $image | Get-Volume
                  $letter = $volume.DriveLetter
                  if (-not $letter) { throw "$($iso.Name) liess sich nicht einhaengen." }
                  Write-Host "  eingehaengt als ${letter}: - Dateisystem $($volume.FileSystem), Bezeichnung $($volume.FileSystemLabel)"

                  foreach ($relative in $expected) {
                      $path = "${letter}:\$relative"
                      if (-not (Test-Path $path)) { throw "In $($iso.Name) fehlt $relative" }
                      Write-Host "  ok  $relative ($((Get-Item $path).Length) Bytes)"
                  }

                  $drivers = Get-ChildItem "${letter}:\drivers" -File
                  if ($drivers.Count -ne 120) { throw "drivers enthaelt $($drivers.Count) statt 120 Dateien." }
                  Write-Host "  ok  drivers ($($drivers.Count) Dateien)"
              }
              finally {
                  Dismount-DiskImage -ImagePath $iso.FullName | Out-Null
              }
          }

          # Microsofts eigene Medien tragen UDF, und die UEFI-Firmware vieler Rechner braucht das auch.
          $udf = $isos | Where-Object { $_.Name -like '*imapi*' }
          if (-not $udf) { throw 'Das ueber IMAPI erzeugte Abbild fehlt.' }

      - name: Programmdatei veroeffentlichen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: |
            artifacts/IsoForge-*.exe
            artifacts/IsoForge-*.exe.sha256
          if-no-files-found: error

      - name: Freigabe anlegen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: IsoForge ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/IsoForge-*.exe
            artifacts/IsoForge-*.exe.sha256
          fail_on_unmatched_files: true
          body: |
            **IsoForge ${{ inputs.release_tag || github.ref_name }}** - Build-Kennung `${{ steps.build.outputs.shortid }}`

            Sichert ein laufendes Windows als startfaehiges ISO-Abbild. Die Programmdatei ist
            eigenstaendig; auf dem Zielrechner wird kein .NET gebraucht. Sie muss als Administrator
            gestartet werden.

            Beim ersten Start warnt der SmartScreen-Filter, weil die Datei nicht signiert ist:
            *Weitere Informationen* - *Trotzdem ausfuehren*.

            Die Pruefsumme steht in der beiliegenden `.sha256`-Datei.
